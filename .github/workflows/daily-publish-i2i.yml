name: 每日写真·图生图（参考图 + 1张精品）

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '手动模式：自定义提示词（留空则使用自动模式）'
        required: false
        default: ''
      caption_text:
        description: '手动模式：自定义配文（可选）'
        required: false
        default: ''
      title:
        description: '自定义标题（可选）'
        required: false
        default: ''

  repository_dispatch:
    types: [daily-beauty-i2i]

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-beauty-i2i-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: python3 -m pip install --upgrade pip

      - name: 图生图·每日1张精品
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          WECHAT_API_KEY: ${{ secrets.WECHAT_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          REFERENCE_IMAGE_URL: ${{ secrets.REFERENCE_IMAGE_URL }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
          INPUT_CAPTION: ${{ github.event.inputs.caption_text }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
        run: |
          cd scripts

          if [ -n "$INPUT_PROMPT" ]; then
            echo "🔧 手动模式：使用自定义提示词"
            CMD="python3 publish_wechat.py --count 1 --prompt \"$INPUT_PROMPT\""
            [ -n "$INPUT_CAPTION" ] && CMD="$CMD --caption-text \"$INPUT_CAPTION\""
            [ -n "$INPUT_TITLE" ]   && CMD="$CMD --title \"$INPUT_TITLE\""
            eval $CMD
          else
            echo "🎨 图生图模式：每日1张精品写真"

            STYLES=("性感系" "甜美系" "国风系" "邻家女孩系" "职场系" "生活场景系" "清纯系")
            EMOTIONS=("挑逗"  "俏皮"   "温柔"  "温柔"       "自信"  "微笑"       "性感")
            DOW=$(date -u +%u)
            IDX=$(( (DOW - 1) % 7 ))
            STYLE="${STYLES[$IDX]}"
            EMOTION="${EMOTIONS[$IDX]}"

            echo "📸 今日风格：${STYLE} | 表情：${EMOTION}"

            python3 publish_wechat.py \
              --count 1 \
              --style "$STYLE" \
              --emotion "$EMOTION" \
              --title "📸 每日写真 | ${STYLE}"
          fi

      - name: 记录运行日志到仓库
        if: always()
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          set -e
          mkdir -p workflow_logs
          TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          MONTH=$(TZ=Asia/Shanghai date '+%Y-%m')
          LOG_FILE="workflow_logs/actions_runs_${MONTH}.md"
          STATUS="$JOB_STATUS"
          if [ -n "$INPUT_PROMPT" ]; then
            MODE=" | mode=i2i-manual | prompt=${INPUT_PROMPT:0:50}..."
          else
            MODE=" | mode=i2i-auto-1pic"
          fi
          echo "- ${TS} | ${STATUS}${MODE} | run=${RUN_NUMBER} | ${RUN_URL}" >> "$LOG_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workflow_logs/
          git commit -m "记录工作流执行日志 (run ${RUN_NUMBER})" || exit 0
          git pull --rebase origin main || true
          git push || echo "⚠️ 日志推送失败（非关键错误）"
