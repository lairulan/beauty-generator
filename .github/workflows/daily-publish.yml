name: 每日写真·文生图（性感风格）

on:
  schedule:
    - cron: '0 12 * * *' # UTC 12:00 = Asia/Shanghai 20:00

  workflow_dispatch:
    inputs:
      prompt:
        description: '手动模式：自定义提示词（留空则使用自动模式）'
        required: false
        default: ''
      prompt_id:
        description: '手动模式：使用已保存提示词 ID（优先于自定义提示词，且不重复保存）'
        required: false
        default: ''
      caption_text:
        description: '手动模式：自定义配文（可选）'
        required: false
        default: ''
      title:
        description: '自定义标题（可选）'
        required: false
        default: ''
      force_google_only:
        description: 'Google 限流时是否禁用豆包兜底（默认 true 保持生产行为）'
        required: false
        type: boolean
        default: true

  repository_dispatch:
    types: [daily-beauty]

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-beauty-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: python3 -m pip install --upgrade pip

      - name: 检查今日自动发布是否已完成
        id: dedupe
        env:
          RUN_EVENT: ${{ github.event_name }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          SHOULD_RUN=true
          SKIP_REASON=
          BRANCH="${GITHUB_REF_NAME:-main}"
          AUTO_EVENT=false

          if [ "$RUN_EVENT" = "repository_dispatch" ] || [ "$RUN_EVENT" = "schedule" ]; then
            AUTO_EVENT=true
          fi

          if [ "$AUTO_EVENT" = "true" ] && [ -z "$INPUT_PROMPT" ]; then
            TODAY=$(TZ=Asia/Shanghai date '+%Y-%m-%d')
            MONTH=$(TZ=Asia/Shanghai date '+%Y-%m')
            LOG_FILE="workflow_logs/actions_runs_${MONTH}.md"
            REMOTE_REF="origin/${BRANCH}"

            API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-publish.yml/runs?status=completed&branch=${BRANCH}&per_page=30"
            RUNS_JSON=$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL" 2>/dev/null || true)

            RUNS_JSON_FILE=$(mktemp)
            API_MATCH=false
            if [ -n "$RUNS_JSON" ]; then
              printf '%s' "$RUNS_JSON" > "$RUNS_JSON_FILE"
              API_MATCH=$(TODAY="$TODAY" CURRENT_RUN_ID="$CURRENT_RUN_ID" RUNS_JSON_FILE="$RUNS_JSON_FILE" python3 -c 'import json, os; from datetime import datetime, timedelta, timezone; runs=json.load(open(os.environ["RUNS_JSON_FILE"])).get("workflow_runs", []); today=os.environ["TODAY"]; current=os.environ.get("CURRENT_RUN_ID", ""); tz=timezone(timedelta(hours=8)); auto_events={"repository_dispatch","schedule"}; print("true" if any(str(run.get("id")) != current and run.get("conclusion") == "success" and run.get("event") in auto_events and ((datetime.fromisoformat(started.replace("Z", "+00:00")).astimezone(tz).strftime("%Y-%m-%d") == today) if started else False) for run in runs for started in [run.get("run_started_at") or run.get("created_at") or run.get("updated_at")]) else "false")')
              rm -f "$RUNS_JSON_FILE"
            fi

            if [ "$API_MATCH" = "true" ]; then
              SHOULD_RUN=false
              SKIP_REASON=actions-success-today
              echo "⏭️ 检测到 ${TODAY} 已有 GitHub Actions 自动成功记录，跳过本次自动发布"
            fi

            git fetch origin "${BRANCH}" --depth=1 >/dev/null 2>&1 || true

            if [ "$SHOULD_RUN" = "true" ] && \
              git cat-file -e "${REMOTE_REF}:${LOG_FILE}" 2>/dev/null && \
              git show "${REMOTE_REF}:${LOG_FILE}" | grep -Eq "^- ${TODAY} .*\\| success \\| mode=t2i-auto-1pic \\|"; then
              SHOULD_RUN=false
              SKIP_REASON=remote-log-success-today
              echo "⏭️ 检测到 ${TODAY} 已有远端日志成功记录，跳过本次自动发布"
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$SKIP_REASON" >> "$GITHUB_OUTPUT"

      - name: 文生图·每日3次贴图
        if: steps.dedupe.outputs.should_run == 'true'
        env:
          FORCE_GOOGLE_ONLY: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_google_only == 'false') && '0' || '1' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_BACKUP: ${{ secrets.GOOGLE_API_KEY_BACKUP }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          WECHAT_API_KEY: ${{ secrets.WECHAT_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          # LLM 文案链路（VLM 看图 + DeepSeek 写文，永不重复 + 图文匹配）
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_VL_MODEL: qwen-vl-plus
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          BEAUTY_CAPTION_TONE: cinematic
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
          INPUT_PROMPT_ID: ${{ github.event.inputs.prompt_id }}
          INPUT_CAPTION: ${{ github.event.inputs.caption_text }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
        run: |
          cd scripts

          ARGS=(python3 publish_wechat.py --count 1)
          if [ -n "$INPUT_PROMPT_ID" ]; then
            echo "🔧 手动模式：使用已保存提示词 ID=${INPUT_PROMPT_ID}"
            ARGS+=(--use-prompt "$INPUT_PROMPT_ID")
            [ -n "$INPUT_CAPTION" ] && ARGS+=(--caption-text "$INPUT_CAPTION")
            [ -n "$INPUT_TITLE" ]   && ARGS+=(--title "$INPUT_TITLE")
            "${ARGS[@]}"
          elif [ -n "$INPUT_PROMPT" ]; then
            echo "🔧 手动模式：使用自定义提示词"
            ARGS+=(--prompt "$INPUT_PROMPT")
            [ -n "$INPUT_CAPTION" ] && ARGS+=(--caption-text "$INPUT_CAPTION")
            [ -n "$INPUT_TITLE" ]   && ARGS+=(--title "$INPUT_TITLE")
            "${ARGS[@]}"
          else
            echo "🎨 文生图模式：每日 3 次贴图（每次 1 张，独立草稿）"

            STYLE="性感系"
            EMOTION="性感"

            echo "📸 今日风格固定：${STYLE} | 表情：${EMOTION}"

            FAIL_COUNT=0
            for i in 1 2 3; do
              echo ""
              echo "==================== 第 ${i}/3 次贴图 ===================="
              if python3 publish_wechat.py \
                --count 1 \
                --style "$STYLE" \
                --emotion "$EMOTION"; then
                echo "✅ 第 ${i}/3 次贴图成功"
              else
                FAIL_COUNT=$((FAIL_COUNT + 1))
                echo "⚠️ 第 ${i}/3 次贴图失败，继续下一次"
              fi
              if [ "$i" -lt 3 ]; then
                sleep 5
              fi
            done

            if [ "$FAIL_COUNT" -eq 3 ]; then
              echo "❌ 全部 3 次贴图均失败"
              exit 1
            fi
            echo "📊 总结：3 次中 $((3 - FAIL_COUNT)) 次成功"
          fi

      - name: 记录运行日志到仓库
        if: always()
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
          INPUT_PROMPT_ID: ${{ github.event.inputs.prompt_id }}
          SHOULD_RUN: ${{ steps.dedupe.outputs.should_run }}
          SKIP_REASON: ${{ steps.dedupe.outputs.skip_reason }}
        run: |
          set -e
          mkdir -p workflow_logs
          TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          MONTH=$(TZ=Asia/Shanghai date '+%Y-%m')
          LOG_FILE="workflow_logs/actions_runs_${MONTH}.md"
          STATUS="$JOB_STATUS"
          AUTO_EVENT=false
          if [ "$RUN_EVENT" = "repository_dispatch" ] || [ "$RUN_EVENT" = "schedule" ]; then
            AUTO_EVENT=true
          fi

          if [ "$AUTO_EVENT" = "true" ] && [ -z "$INPUT_PROMPT" ] && [ -z "$INPUT_PROMPT_ID" ] && [ "$SHOULD_RUN" != "true" ]; then
            MODE=" | mode=t2i-auto-skipped-duplicate | reason=${SKIP_REASON:-already-published-today}"
          elif [ "$RUN_EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_PROMPT_ID" ]; then
            MODE=" | mode=t2i-manual-library | prompt_id=${INPUT_PROMPT_ID}"
          elif [ "$RUN_EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_PROMPT" ]; then
            MODE=" | mode=t2i-manual | prompt=${INPUT_PROMPT:0:50}..."
          elif [ "$RUN_EVENT" = "workflow_dispatch" ]; then
            MODE=" | mode=t2i-manual-workflow-dispatch"
          else
            MODE=" | mode=t2i-auto-1pic | event=${RUN_EVENT}"
          fi
          echo "- ${TS} | ${STATUS}${MODE} | run=${RUN_NUMBER} | ${RUN_URL}" >> "$LOG_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workflow_logs/ config/manual_prompts.json logs/caption_history.jsonl
          git commit -m "记录工作流执行日志 (run ${RUN_NUMBER})" || exit 0
          git pull --rebase origin main || true
          git push || echo "⚠️ 日志推送失败（非关键错误）"
