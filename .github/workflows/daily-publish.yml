name: 每日艺术写真发布（7风格×50张）

on:
  # 兜底定时：禁用（统一由 Cloudflare Worker github-scheduler 触发）
  # schedule:
  #   - cron: '30 11 * * *'

  # Cloudflare Worker 通过 workflow_dispatch 触发
  workflow_dispatch:
    inputs:
      prompt:
        description: '手动模式：自定义提示词（留空则使用自动7风格模式）'
        required: false
        default: ''
      caption_text:
        description: '手动模式：自定义配文（可选）'
        required: false
        default: ''
      title:
        description: '自定义标题（可选）'
        required: false
        default: ''

  # 支持 repository_dispatch 触发（来自 Cloudflare Worker）
  repository_dispatch:
    types: [daily-beauty]

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-beauty-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: python3 -m pip install --upgrade pip

      - name: 生成并发布（手动模式 or 7风格50张自动模式）
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          WECHAT_API_KEY: ${{ secrets.WECHAT_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
          INPUT_CAPTION: ${{ github.event.inputs.caption_text }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
        run: |
          cd scripts

          if [ -n "$INPUT_PROMPT" ]; then
            # ── 手动模式：单张自定义 ──
            echo "🔧 手动模式：使用自定义提示词"
            CMD="python3 publish_wechat.py --count 1 --prompt \"$INPUT_PROMPT\""
            [ -n "$INPUT_CAPTION" ] && CMD="$CMD --caption-text \"$INPUT_CAPTION\""
            [ -n "$INPUT_TITLE" ]   && CMD="$CMD --title \"$INPUT_TITLE\""
            eval $CMD
          else
            # ── 自动模式：7风格 × 7-8张 = 50张，每风格一篇草稿 ──
            echo "🎨 自动模式：7风格×50张 → 7篇草稿入库"

            # 风格数组（7种）及对应表情
            STYLES=("性感系" "甜美系" "国风系" "邻家女孩系" "职场系" "生活场景系" "清纯系")
            EMOTIONS=("挑逗"  "俏皮"   "温柔"  "温柔"       "自信"  "微笑"       "性感")
            COUNTS=(  7       7        7       7            7       7            8   )
            # 合计：7*6+8 = 50

            SUCCESS=0
            FAIL=0

            for i in "${!STYLES[@]}"; do
              STYLE="${STYLES[$i]}"
              EMOTION="${EMOTIONS[$i]}"
              COUNT="${COUNTS[$i]}"
              BATCH=$((i+1))

              echo ""
              echo "════════════════════════════════════"
              echo "📸 第${BATCH}/7 批：${STYLE} × ${COUNT}张"
              echo "════════════════════════════════════"

              if python3 publish_wechat.py \
                  --count "$COUNT" \
                  --style "$STYLE" \
                  --emotion "$EMOTION" \
                  --title "📸 每日写真 | ${STYLE}"; then
                echo "✅ ${STYLE} 批次完成"
                SUCCESS=$((SUCCESS+1))
              else
                echo "⚠️  ${STYLE} 批次失败，继续下一批..."
                FAIL=$((FAIL+1))
              fi

              # 批次间隔，避免 API 限速
              [ "$BATCH" -lt 7 ] && sleep 8
            done

            echo ""
            echo "════════════════════════════════════"
            echo "📊 汇总：成功 ${SUCCESS}/7 批，失败 ${FAIL}/7 批"
            echo "════════════════════════════════════"

            # 任意一批成功即视为整体成功
            [ "$SUCCESS" -gt 0 ] || exit 1
          fi

      - name: 记录运行日志到仓库
        if: always()
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          set -e
          mkdir -p workflow_logs
          TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          MONTH=$(TZ=Asia/Shanghai date '+%Y-%m')
          LOG_FILE="workflow_logs/actions_runs_${MONTH}.md"
          STATUS="$JOB_STATUS"
          if [ -n "$INPUT_PROMPT" ]; then
            MODE=" | mode=manual | prompt=${INPUT_PROMPT:0:50}..."
          else
            MODE=" | mode=auto-50pics-7styles"
          fi
          echo "- ${TS} | ${STATUS}${MODE} | run=${RUN_NUMBER} | ${RUN_URL}" >> "$LOG_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workflow_logs/
          git commit -m "记录工作流执行日志 (run ${RUN_NUMBER})" || exit 0
          git pull --rebase origin main || true
          git push || echo "⚠️ 日志推送失败（非关键错误）"
