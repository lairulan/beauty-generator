name: 每日艺术写真发布

on:
  # 兜底定时：UTC 12:00（北京20:00），CF Worker 失败时自动补发
  # schedule (disabled: managed by Cloudflare Worker github-scheduler):
  # schedule:
  #    - cron: '0 12 * * *'

  # Cloudflare Worker 通过 workflow_dispatch 触发（支持手动提示词）
  workflow_dispatch:
    inputs:
      prompt:
        description: '手动模式：自定义提示词（留空则使用自动模式）'
        required: false
        default: ''
      caption_text:
        description: '手动模式：自定义配文（可选）'
        required: false
        default: ''
      title:
        description: '自定义标题（可选）'
        required: false
        default: ''

  # 支持 repository_dispatch 触发（来自 Cloudflare Worker）
  repository_dispatch:
    types: [daily-beauty]

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-beauty-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python3 -m pip install --upgrade pip

      - name: 计算今日风格
        id: style
        run: |
          # 星期风格轮换：0=周日 1=周一 ... 6=周六
          # 7日7风格：贴近生活、温暖性感、男性审美优化
          DOW=$(TZ=Asia/Shanghai date +%w)
          case $DOW in
            0) STYLE="邻家女孩系"; EMOTION="温柔" ;;   # 周日 - 邻家亲切
            1) STYLE="性感系"; EMOTION="挑逗" ;;     # 周一 - 性感开场
            2) STYLE="甜美系"; EMOTION="俏皮" ;;     # 周二 - 甜美活泼
            3) STYLE="国风系"; EMOTION="温柔" ;;     # 周三 - 古典韵味
            4) STYLE="职场系"; EMOTION="自信" ;;     # 周四 - 职场诱惑
            5) STYLE="生活场景系"; EMOTION="微笑" ;; # 周五 - 居家温馨
            6) STYLE="清纯系"; EMOTION="性感" ;;     # 周六 - 纯欲周末
          esac
          echo "style=$STYLE" >> $GITHUB_OUTPUT
          echo "emotion=$EMOTION" >> $GITHUB_OUTPUT
          echo "今日风格: $STYLE / $EMOTION (星期$DOW)"

      - name: 生成并发布艺术写真
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          WECHAT_API_KEY: ${{ secrets.WECHAT_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
          INPUT_CAPTION: ${{ github.event.inputs.caption_text }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
        run: |
          cd scripts
          if [ -n "$INPUT_PROMPT" ]; then
            echo "🔧 手动模式：使用自定义提示词"
            CMD="python3 publish_wechat.py --count 1 --prompt \"$INPUT_PROMPT\""
            [ -n "$INPUT_CAPTION" ] && CMD="$CMD --caption-text \"$INPUT_CAPTION\""
            [ -n "$INPUT_TITLE" ] && CMD="$CMD --title \"$INPUT_TITLE\""
            eval $CMD
          else
            echo "🔧 自动模式：风格 ${{ steps.style.outputs.style }} / ${{ steps.style.outputs.emotion }}"
            python3 publish_wechat.py --count 1 \
              --style "${{ steps.style.outputs.style }}" \
              --emotion "${{ steps.style.outputs.emotion }}"
          fi

      - name: 记录日志
        if: always()
        run: |
          echo "任务执行时间: $(date)"
          echo "时区: Asia/Shanghai"

      - name: 记录运行日志到仓库
        if: always()
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          DAILY_STYLE: ${{ steps.style.outputs.style }}
          DAILY_EMOTION: ${{ steps.style.outputs.emotion }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          set -e
          mkdir -p workflow_logs
          TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          MONTH=$(TZ=Asia/Shanghai date '+%Y-%m')
          LOG_FILE="workflow_logs/actions_runs_${MONTH}.md"
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="success"
          else
            STATUS="$JOB_STATUS"
          fi
          STYLE_INFO=""
          if [ -n "$INPUT_PROMPT" ]; then
            STYLE_INFO=" | mode=manual | prompt=${INPUT_PROMPT:0:50}..."
          elif [ -n "$DAILY_STYLE" ]; then
            STYLE_INFO=" | style=${DAILY_STYLE}/${DAILY_EMOTION}"
          fi
          echo "- ${TS} | ${STATUS} | event=${RUN_EVENT}${STYLE_INFO} | run=${RUN_NUMBER} | ${RUN_URL}" >> "$LOG_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workflow_logs/
          git commit -m "记录工作流执行日志 (run ${RUN_NUMBER})" || exit 0
          git pull --rebase origin main || true
          git push || echo "⚠️ 日志推送失败（非关键错误）"
